name: One-Tap Release Keystore Setup

on:
  workflow_dispatch:
    inputs:
      overwrite_existing:
        description: "Keep false unless intentionally replacing an unused keystore"
        required: false
        default: false
        type: boolean
      build_release_aab:
        description: "Also build and output signed app-release.aab right away"
        required: false
        default: true
        type: boolean

jobs:
  generate-and-store-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GH_SECRETS_TOKEN is configured
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          set +x
          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: Missing repository secret 'GH_SECRETS_TOKEN'."
            echo "Create a GitHub Fine-grained Personal Access Token (Repository access: this repo only, Permissions: Secrets Read/Write) and add it as Actions secret GH_SECRETS_TOKEN."
            exit 1
          fi

      - name: Guard against accidentally overwriting existing signing secrets
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          OVERWRITE: ${{ github.event.inputs.overwrite_existing }}
        run: |
          set +x
          EXISTING="$(gh secret list --repo "${{ github.repository }}" --json name --jq '.[].name')"
          if echo "$EXISTING" | grep -qx "KEYSTORE_BASE64"; then
            if [ "$OVERWRITE" != "true" ]; then
              echo "KEYSTORE_BASE64 already exists. Aborting to protect your Google Play upload key (use 'Production Release AAB' workflow instead, or set overwrite_existing=true only if you have not uploaded to Play Console yet)."
              exit 1
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        if: ${{ github.event.inputs.build_release_aab == 'true' || github.event.inputs.build_release_aab == true }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses if available
        if: ${{ github.event.inputs.build_release_aab == 'true' || github.event.inputs.build_release_aab == true }}
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Run offline and Robolectric unit tests
        if: ${{ github.event.inputs.build_release_aab == 'true' || github.event.inputs.build_release_aab == true }}
        run: |
          gradle :app:testDebugUnitTest \
            --tests "com.example.ExampleUnitTest" \
            --tests "com.example.ExampleRobolectricTest" \
            --tests "com.example.LearningCoreRobolectricTest" \
            --tests "com.example.LearningAudioRobolectricTest" \
            --no-daemon --stacktrace

      - name: Run Android Lint (Release)
        if: ${{ github.event.inputs.build_release_aab == 'true' || github.event.inputs.build_release_aab == true }}
        run: gradle :app:lintRelease --no-daemon --stacktrace

      - name: Generate upload keystore, save secrets, and build signed AAB
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          BUILD_AAB: ${{ github.event.inputs.build_release_aab }}
        run: |
          set +x
          umask 077
          KEYSTORE_FILE="${{ runner.temp }}/my-upload-key.jks"
          STORE_PASS="$(openssl rand -hex 20)"
          KEY_PASS="$(openssl rand -hex 20)"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"

          export STORE_PASS
          export KEY_PASS

          keytool -genkeypair -noprompt \
            -storetype JKS \
            -keystore "$KEYSTORE_FILE" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass:env STORE_PASS \
            -keypass:env KEY_PASS \
            -dname "CN=Farsi-Joon Release, O=Farsi-Joon"

          B64_CONTENT="$(base64 -w 0 "$KEYSTORE_FILE")"
          echo "::add-mask::$B64_CONTENT"

          printf '%s' "$B64_CONTENT" | gh secret set KEYSTORE_BASE64 --repo "${{ github.repository }}"
          printf '%s' "$STORE_PASS" | gh secret set STORE_PASSWORD --repo "${{ github.repository }}"
          printf '%s' "$KEY_PASS" | gh secret set KEY_PASSWORD --repo "${{ github.repository }}"

          CERT_INFO="$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass:env STORE_PASS -alias upload | grep -E 'SHA1:|SHA256:')"
          {
            echo "Farsi Joon Upload Keystore Configured Safely"
            echo "Secrets updated: KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD"
            echo "Upload certificate fingerprints (add to Firebase Console -> com.tavana.farsijoon):"
            echo "$CERT_INFO"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$BUILD_AAB" = "true" ]; then
            KEYSTORE_PATH="$KEYSTORE_FILE" STORE_PASSWORD="$STORE_PASS" KEY_PASSWORD="$KEY_PASS" \
              gradle :app:bundleRelease --no-daemon --stacktrace
          fi

          unset STORE_PASS KEY_PASS B64_CONTENT

      - name: Verify this is a real release AAB
        if: ${{ github.event.inputs.build_release_aab == 'true' || github.event.inputs.build_release_aab == true }}
        shell: bash
        run: |
          set -euo pipefail
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"

          # 1) Exact path and size > 1 MB (1048576 bytes)
          if [ ! -f "$AAB_PATH" ]; then
            echo "FAIL: Missing release bundle at $AAB_PATH"
            exit 1
          fi
          AAB_BYTES="$(wc -c < "$AAB_PATH" | tr -d '[:space:]')"
          if [ "$AAB_BYTES" -le 1048576 ]; then
            echo "FAIL: $AAB_PATH size ($AAB_BYTES bytes) is not larger than 1 MB."
            exit 1
          fi

          # 2) Signature & certificate Owner check
          jarsigner -verify "$AAB_PATH" >/dev/null
          CERT_OUT="$(keytool -printcert -jarfile "$AAB_PATH")"
          OWNER_LINE="$(echo "$CERT_OUT" | grep -m1 'Owner:' || true)"
          if ! echo "$OWNER_LINE" | grep -q 'CN=Farsi-Joon Release'; then
            echo "FAIL: Signing certificate Owner does not contain 'CN=Farsi-Joon Release' (found: $OWNER_LINE)."
            exit 1
          fi
          if echo "$CERT_OUT" | grep -qi 'Android Debug'; then
            echo "FAIL: Signing certificate contains 'Android Debug'. Debug-signed bundles are blocked."
            exit 1
          fi
          SHA1_LINE="$(echo "$CERT_OUT" | grep -m1 'SHA1:' | xargs)"
          SHA256_LINE="$(echo "$CERT_OUT" | grep -m1 'SHA256:' | xargs)"

          # 3) Pinned stable bundletool (1.18.3) download + SHA-256 verification + manifest dump
          BUNDLETOOL_VERSION="1.18.3"
          BUNDLETOOL_SHA256="a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
          BUNDLETOOL_JAR="${{ runner.temp }}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl -fsSL "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" -o "$BUNDLETOOL_JAR"
          test -s "$BUNDLETOOL_JAR"
          echo "${BUNDLETOOL_SHA256}  ${BUNDLETOOL_JAR}" | sha256sum -c -

          MANIFEST_XML="${{ runner.temp }}/aab-manifest.xml"
          java -jar "$BUNDLETOOL_JAR" dump manifest --bundle="$AAB_PATH" > "$MANIFEST_XML"

          python3 - "$AAB_PATH" "$MANIFEST_XML" <<'PYEOF'
          import json, os, sys, zipfile
          import xml.etree.ElementTree as ET

          aab_path, manifest_path = sys.argv[1], sys.argv[2]
          manifest_text = open(manifest_path, "r", encoding="utf-8").read()

          # 5) Old package must not appear anywhere in manifest dump
          if "com.aistudio.farsijoon.kqvtzr" in manifest_text:
              print("FAIL: Old package name com.aistudio.farsijoon.kqvtzr appeared in AAB manifest dump.")
              sys.exit(1)

          # 3) Manifest package, versionCode, versionName, android:debuggable
          ANDROID_NS = "{http://schemas.android.com/apk/res/android}"
          root = ET.fromstring(manifest_text)
          pkg = root.attrib.get("package", "")
          ver_code = root.attrib.get(f"{ANDROID_NS}versionCode", "")
          ver_name = root.attrib.get(f"{ANDROID_NS}versionName", "")
          if pkg != "com.tavana.farsijoon":
              print(f"FAIL: AAB manifest package is '{pkg}', expected 'com.tavana.farsijoon'.")
              sys.exit(1)
          if not ver_code or not ver_name:
              print(f"FAIL: Missing versionCode ('{ver_code}') or versionName ('{ver_name}') in AAB manifest.")
              sys.exit(1)
          app_el = root.find("application")
          if app_el is None:
              print("FAIL: Missing <application> element in AAB manifest.")
              sys.exit(1)
          debuggable = app_el.attrib.get(f"{ANDROID_NS}debuggable")
          if debuggable is not None and debuggable.lower() != "false":
              print(f"FAIL: android:debuggable is '{debuggable}' (must be absent or false).")
              sys.exit(1)

          # 4) Required files inside the AAB archive
          with zipfile.ZipFile(aab_path, "r") as zf:
              names = set(zf.namelist())
          for required in [
              "base/manifest/AndroidManifest.xml",
              "base/assets/lessons.json",
              "base/assets/stories.json",
          ]:
              if required not in names:
                  print(f"FAIL: Missing required entry '{required}' inside {aab_path}.")
                  sys.exit(1)

          # 6) app/google-services.json check
          gs_path = "app/google-services.json"
          if not os.path.isfile(gs_path) or os.path.getsize(gs_path) == 0:
              print("FAIL: app/google-services.json is missing. Add Android app com.tavana.farsijoon in Firebase Console > Project settings > Your apps, download google-services.json, and upload it to app/ on GitHub.")
              sys.exit(1)
          with open(gs_path, "r", encoding="utf-8") as f:
              gs_data = json.load(f)
          gs_pkgs = [
              c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for c in gs_data.get("client", [])
          ]
          if "com.tavana.farsijoon" not in gs_pkgs:
              print(f"FAIL: app/google-services.json does not contain package_name com.tavana.farsijoon (found: {gs_pkgs}). Download the updated google-services.json for com.tavana.farsijoon from Firebase Console and upload it to app/ on GitHub.")
              sys.exit(1)
          PYEOF

          VERSION_CODE="$(python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("'"$MANIFEST_XML"'").getroot(); print(r.attrib["{http://schemas.android.com/apk/res/android}versionCode"])')"
          VERSION_NAME="$(python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("'"$MANIFEST_XML"'").getroot(); print(r.attrib["{http://schemas.android.com/apk/res/android}versionName"])')"
          {
            echo ""
            echo "PASS"
            echo "applicationId: com.tavana.farsijoon"
            echo "versionName: $VERSION_NAME"
            echo "versionCode: $VERSION_CODE"
            echo "AAB size: $AAB_BYTES bytes"
            echo "Upload certificate $SHA1_LINE"
            echo "Upload certificate $SHA256_LINE"
            echo "Source: Production Release workflow (not debug)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Production Release AAB artifact
        if: ${{ github.event.inputs.build_release_aab == 'true' || github.event.inputs.build_release_aab == true }}
        uses: actions/upload-artifact@v4
        with:
          name: farsi-joon-production-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Shred temporary keystore file
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/my-upload-key.jks" ]; then
            shred -u "${{ runner.temp }}/my-upload-key.jks" || rm -f "${{ runner.temp }}/my-upload-key.jks"
          fi
