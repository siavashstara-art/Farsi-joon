name: One-Tap Release Keystore Setup

on:
  workflow_dispatch:
    inputs:
      overwrite_existing:
        description: "Keep false unless intentionally replacing an unused keystore"
        required: false
        default: false
        type: boolean

jobs:
  generate-and-store-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GH_SECRETS_TOKEN is configured
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          set +x
          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: Missing repository secret 'GH_SECRETS_TOKEN'."
            echo "Create a GitHub Fine-grained Personal Access Token (Repository access: this repo only, Permissions: Secrets Read/Write) and add it as Actions secret GH_SECRETS_TOKEN."
            exit 1
          fi

      - name: Guard against accidentally overwriting existing signing secrets
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          OVERWRITE: ${{ github.event.inputs.overwrite_existing }}
        run: |
          set +x
          EXISTING="$(gh secret list --repo "${{ github.repository }}" --json name --jq '.[].name')"
          if echo "$EXISTING" | grep -qx "KEYSTORE_BASE64"; then
            if [ "$OVERWRITE" != "true" ]; then
              echo "KEYSTORE_BASE64 already exists. Aborting to protect your Google Play upload key (set overwrite_existing=true only if you have not uploaded to Play Console yet)."
              exit 1
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate upload keystore and save directly to GitHub Secrets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          set +x
          umask 077
          KEYSTORE_FILE="${{ runner.temp }}/my-upload-key.jks"
          STORE_PASS="$(openssl rand -hex 20)"
          KEY_PASS="$(openssl rand -hex 20)"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"

          export STORE_PASS
          export KEY_PASS

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE_FILE" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass:env STORE_PASS \
            -keypass:env KEY_PASS \
            -dname "CN=Farsi-Joon Release, O=Farsi-Joon"

          B64_CONTENT="$(base64 -w 0 "$KEYSTORE_FILE")"
          echo "::add-mask::$B64_CONTENT"

          printf '%s' "$B64_CONTENT" | gh secret set KEYSTORE_BASE64 --repo "${{ github.repository }}"
          printf '%s' "$STORE_PASS" | gh secret set STORE_PASSWORD --repo "${{ github.repository }}"
          printf '%s' "$KEY_PASS" | gh secret set KEY_PASSWORD --repo "${{ github.repository }}"

          CERT_INFO="$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass:env STORE_PASS -alias upload | grep -E 'SHA1:|SHA256:')"
          {
            echo "## Farsi-Joon Upload Keystore Configured Safely"
            echo ""
            echo "All 3 release secrets (\`KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, \`KEY_PASSWORD\`) were written directly to GitHub Encrypted Secrets with zero file downloads or copy-pasting."
            echo ""
            echo "### Copy these public fingerprints into Firebase Console -> Project Settings -> Your Android App:"
            echo "\`\`\`text"
            echo "$CERT_INFO"
            echo "\`\`\`"
            echo ""
            echo "### Recommended Next Step:"
            echo "Delete \`GH_SECRETS_TOKEN\` from Repository Secrets now if you no longer need it, then run **Production Release AAB**."
          } >> "$GITHUB_STEP_SUMMARY"

          unset STORE_PASS KEY_PASS B64_CONTENT

      - name: Shred temporary keystore file
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/my-upload-key.jks" ]; then
            shred -u "${{ runner.temp }}/my-upload-key.jks" || rm -f "${{ runner.temp }}/my-upload-key.jks"
          fi
