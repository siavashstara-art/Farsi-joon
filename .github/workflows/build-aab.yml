name: Release AAB (Farsi-Joon)

on:
  workflow_dispatch:

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses if available
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build release bundle
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Create upload keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -noprompt -keystore upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Farsi Joon, O=Tavana, C=IR"
          echo "$PASS" > keystore-password.txt

      - name: Sign the AAB with upload key
        run: |
          AAB=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
          echo "Found: $AAB"
          test -s "$AAB"
          cp "$AAB" farsi-joon-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore upload-keystore.jks \
            -storepass "$(cat keystore-password.txt)" \
            farsi-joon-release.aab upload

      - name: Verify signature is not Android Debug
        run: |
          jarsigner -verify -verbose -certs farsi-joon-release.aab | grep "CN=" | head -3
          if jarsigner -verify -verbose -certs farsi-joon-release.aab | grep -q "CN=Android Debug"; then
            echo "ERROR still debug-signed"; exit 1
          fi

      - name: Upload release AAB and keystore
        uses: actions/upload-artifact@v4
        with:
          name: farsi-joon-release
          path: |
            farsi-joon-release.aab
            upload-keystore.jks
            keystore-password.txt
          if-no-files-found: error
