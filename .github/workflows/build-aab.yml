name: Debug Testing AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-debug-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore if missing
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK licenses if available
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Run offline and Robolectric unit tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests "com.example.ExampleUnitTest" \
            --tests "com.example.ExampleRobolectricTest" \
            --tests "com.example.LearningCoreRobolectricTest" \
            --tests "com.example.LearningAudioRobolectricTest" \
            --no-daemon --stacktrace

      - name: Upload unit test failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-report-debug
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build Debug AAB & APK (testing only - never for Google Play production)
        run: gradle :app:bundleDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug Testing AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: farsi-joon-debug-testing-aab
          path: app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error

      - name: Upload Debug Testing APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: farsi-joon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
