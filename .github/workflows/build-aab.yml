name: Production Release AAB (Automatic)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  build-production-release-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure app/google-services.json exists (fallback embed)
        shell: bash
        run: |
          if [ ! -s app/google-services.json ]; then
            echo "Creating provisioned app/google-services.json for com.tavana.farsijoon..."
            printf '%s' "" | base64 -d > app/google-services.json
          fi
          test -s app/google-services.json
          grep -q "com.tavana.farsijoon" app/google-services.json
          echo "Verified app/google-services.json ready."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify keystore and passwords
        id: verify_keystore
        shell: bash
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          umask 077

          KEYSTORE_FILE="${{ runner.temp }}/my-upload-key.jks"
          ENV_STORE_FILE="${{ runner.temp }}/.ks_env"
          rm -f "$KEYSTORE_FILE" "$ENV_STORE_FILE"

          cat > "${{ runner.temp }}/VerifyKeystore.java" <<'JEOF'
          import java.io.File;
          import java.security.Key;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.security.UnrecoverableKeyException;
          import java.security.cert.Certificate;
          import java.security.cert.X509Certificate;
          import java.util.Collections;

          public class VerifyKeystore {
              public static void main(String[] args) throws Exception {
                  String path = args[0];
                  String alias = args[1];
                  char[] storePass = System.getenv("VERIFY_STORE_PASS").toCharArray();
                  char[] keyPass = System.getenv("VERIFY_KEY_PASS").toCharArray();

                  KeyStore ks;
                  try {
                      ks = KeyStore.getInstance(new File(path), storePass);
                  } catch (Exception e) {
                      System.err.println("STORE_OR_FORMAT_ERROR: " + e.getClass().getSimpleName() + ": " + e.getMessage());
                      System.exit(11);
                      return;
                  }

                  if (!ks.containsAlias(alias)) {
                      System.err.println("ALIAS_MISSING: expected '" + alias + "', found: " + Collections.list(ks.aliases()));
                      System.exit(12);
                      return;
                  }

                  try {
                      Key k = ks.getKey(alias, keyPass);
                      if (k == null) {
                          System.err.println("KEY_NULL: alias '" + alias + "' has no private key");
                          System.exit(13);
                          return;
                      }
                  } catch (UnrecoverableKeyException e) {
                      String hint = "";
                      try {
                          if (ks.getKey(alias, storePass) != null) {
                              hint = " (STORE_PASSWORD unlocks the private key, meaning KEY_PASSWORD secret does not match; for PKCS12 keystores STORE_PASSWORD and KEY_PASSWORD must be identical)";
                          }
                      } catch (Exception ignored) {}
                      System.err.println("KEY_PASSWORD_MISMATCH: " + e.getMessage() + hint);
                      System.exit(14);
                      return;
                  }

                  Certificate cert = ks.getCertificate(alias);
                  if (cert == null) {
                      System.err.println("CERT_MISSING: no certificate for alias '" + alias + "'");
                      System.exit(15);
                      return;
                  }
                  byte[] sha256 = MessageDigest.getInstance("SHA-256").digest(cert.getEncoded());
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < sha256.length; i++) {
                      if (i > 0) sb.append(':');
                      sb.append(String.format("%02X", sha256[i]));
                  }
                  String subject = (cert instanceof X509Certificate x509) ? x509.getSubjectX500Principal().getName() : "unknown";
                  if (subject.toLowerCase().contains("android debug")) {
                      System.err.println("DEBUG_CERT_REJECTED: Certificate is Android Debug (" + subject + ")");
                      System.exit(16);
                      return;
                  }
                  System.out.println("TYPE=" + ks.getType());
                  System.out.println("SUBJECT=" + subject);
                  System.out.println("SHA256=" + sb.toString());
              }
          }
          JEOF

          USE_FRESH_KEY=false
          DIAG_NOTE=""

          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            echo "Verifying existing repository signing secrets (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD, alias 'upload')..."
            if ! printf '%s' "$SECRET_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE" 2>/dev/null || [ ! -s "$KEYSTORE_FILE" ]; then
              USE_FRESH_KEY=true
              DIAG_NOTE="KEYSTORE_BASE64 is not valid base64 or decoded to an empty file."
            else
              set +e
              VERIFY_OUT="$(VERIFY_STORE_PASS="$SECRET_STORE_PASS" VERIFY_KEY_PASS="$SECRET_KEY_PASS" java "${{ runner.temp }}/VerifyKeystore.java" "$KEYSTORE_FILE" "upload" 2>&1)"
              VERIFY_RC=$?
              set -e
              if [ "$VERIFY_RC" -eq 0 ]; then
                echo "Verified repository upload keystore (alias 'upload'):"
                echo "$VERIFY_OUT"
                STORE_PASS="$SECRET_STORE_PASS"
                KEY_PASS="$SECRET_KEY_PASS"
                KEY_SOURCE="Repository Secrets (permanent upload key)"
              else
                USE_FRESH_KEY=true
                DIAG_NOTE="Repository signing secrets failed pre-Gradle verification: $VERIFY_OUT"
                rm -f "$KEYSTORE_FILE"
              fi
            fi
          else
            USE_FRESH_KEY=true
            DIAG_NOTE="One or more signing secrets (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) are not configured."
          fi

          if [ "$USE_FRESH_KEY" = "true" ]; then
            echo "::warning::$DIAG_NOTE Generating a fresh upload keystore (alias 'upload') for this release build."
            FRESH_PASS="$(openssl rand -hex 20)"
            STORE_PASS="$FRESH_PASS"
            KEY_PASS="$FRESH_PASS"
            keytool -genkeypair -noprompt \
              -storetype JKS \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Farsi Joon, O=Tavana, C=IR"
            VERIFY_OUT="$(VERIFY_STORE_PASS="$STORE_PASS" VERIFY_KEY_PASS="$KEY_PASS" java "${{ runner.temp }}/VerifyKeystore.java" "$KEYSTORE_FILE" "upload")"
            KEY_SOURCE="Fresh runner upload keystore (Play App Signing accepts this for first Play Console upload; update KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD secrets for future updates or use Play Console Upload Key Reset)"
          fi

          EXPECTED_SHA256="$(echo "$VERIFY_OUT" | sed -n 's/^SHA256=//p' | head -n1)"
          test -n "$EXPECTED_SHA256"

          # Verify keytool -list also passes cleanly on the active keystore
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASS" -alias upload > /dev/null

          # Pass active credentials strictly inside runner.temp with 0600 permissions (never via logs or artifacts)
          {
            printf 'STORE_PASS=%q\n' "$STORE_PASS"
            printf 'KEY_PASS=%q\n' "$KEY_PASS"
            printf 'KEY_SOURCE=%q\n' "$KEY_SOURCE"
            printf 'EXPECTED_SHA256=%q\n' "$EXPECTED_SHA256"
            printf 'DIAG_NOTE=%q\n' "$DIAG_NOTE"
          } > "$ENV_STORE_FILE"
          chmod 600 "$ENV_STORE_FILE"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses if available
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Run offline and Robolectric unit tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests "com.example.ExampleUnitTest" \
            --tests "com.example.ExampleRobolectricTest" \
            --tests "com.example.LearningCoreRobolectricTest" \
            --tests "com.example.LearningAudioRobolectricTest" \
            --no-daemon --stacktrace

      - name: Run Android Lint (Release)
        run: gradle :app:lintRelease --no-daemon --stacktrace

      - name: Build signed Production Release AAB
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          KEYSTORE_FILE="${{ runner.temp }}/my-upload-key.jks"
          ENV_STORE_FILE="${{ runner.temp }}/.ks_env"
          RELEASE_PKG_DIR="${{ runner.temp }}/release-package"
          mkdir -p "$RELEASE_PKG_DIR"

          # Load verified active signing credentials created by pre-Gradle verification
          source "$ENV_STORE_FILE"
          test -s "$KEYSTORE_FILE"

          # Ensure debug.keystore exists at workspace root so AGP signingConfigs evaluation never fails
          if [ ! -s "${{ github.workspace }}/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "${{ github.workspace }}/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Build signed Production Release AAB exclusively
          KEYSTORE_PATH="$KEYSTORE_FILE" STORE_PASSWORD="$STORE_PASS" KEY_PASSWORD="$KEY_PASS" \
            gradle :app:bundleRelease --no-daemon --no-configuration-cache --stacktrace

          CERT_FINGERPRINTS="$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASS" -alias upload | grep -E 'SHA1:|SHA256:')"
          printf "Farsi Joon (com.tavana.farsijoon) Google Play Production Release\n-----------------------------------------------------------------\nFile for Google Play Console: app-release.aab\nKey Source: %s\nUpload Certificate Fingerprints:\n%s\n\nAdd the Play Console App Signing SHA-1 and SHA-256 certificates to Firebase (com.tavana.farsijoon) and enable Play Integrity in App Check.\n" \
            "$KEY_SOURCE" "$CERT_FINGERPRINTS" > "$RELEASE_PKG_DIR/release-info.txt"

          echo "KEY_SOURCE=$KEY_SOURCE" >> "$GITHUB_ENV"
          echo "EXPECTED_CERT_SHA256=$EXPECTED_SHA256" >> "$GITHUB_ENV"
          echo "KEY_DIAG_NOTE=$DIAG_NOTE" >> "$GITHUB_ENV"
          echo "RELEASE_PKG_DIR_PATH=$RELEASE_PKG_DIR" >> "$GITHUB_ENV"

      - name: Verify this is a real release AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"

          # 1) Exact path and size > 1 MB (1048576 bytes)
          if [ ! -f "$AAB_PATH" ]; then
            echo "FAIL: Missing release bundle at $AAB_PATH"
            exit 1
          fi
          AAB_BYTES="$(wc -c < "$AAB_PATH" | tr -d '[:space:]')"
          if [ "$AAB_BYTES" -le 1048576 ]; then
            echo "FAIL: $AAB_PATH size ($AAB_BYTES bytes) is not larger than 1 MB."
            exit 1
          fi

          # 2) Signature & non-Debug certificate + SHA-256 fingerprint match check
          jarsigner -verify "$AAB_PATH" >/dev/null
          CERT_OUT="$(keytool -printcert -jarfile "$AAB_PATH")"
          OWNER_LINE="$(echo "$CERT_OUT" | grep -m1 'Owner:' || true)"
          if [ -z "$OWNER_LINE" ]; then
            echo "FAIL: Could not read signing certificate Owner from $AAB_PATH."
            exit 1
          fi
          if echo "$CERT_OUT" | grep -qi 'Android Debug'; then
            echo "FAIL: Signing certificate contains 'Android Debug'. Debug-signed bundles are blocked."
            exit 1
          fi
          SHA1_LINE="$(echo "$CERT_OUT" | grep -m1 'SHA1:' | xargs)"
          SHA256_LINE="$(echo "$CERT_OUT" | grep -m1 'SHA256:' | xargs)"
          ACTUAL_SHA256="$(echo "$SHA256_LINE" | sed -E 's/^SHA256:[[:space:]]*//')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "FAIL: AAB SHA-256 ($ACTUAL_SHA256) does not match verified upload keystore ($EXPECTED_CERT_SHA256)."
            exit 1
          fi

          # 3) Pinned stable bundletool (1.18.3) download + SHA-256 verification + manifest dump
          BUNDLETOOL_VERSION="1.18.3"
          BUNDLETOOL_SHA256="a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
          BUNDLETOOL_JAR="${{ runner.temp }}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl -fsSL "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" -o "$BUNDLETOOL_JAR"
          test -s "$BUNDLETOOL_JAR"
          echo "${BUNDLETOOL_SHA256}  ${BUNDLETOOL_JAR}" | sha256sum -c -

          MANIFEST_XML="${{ runner.temp }}/aab-manifest.xml"
          java -jar "$BUNDLETOOL_JAR" dump manifest --bundle="$AAB_PATH" > "$MANIFEST_XML"

          python3 - "$AAB_PATH" "$MANIFEST_XML" <<'PYEOF'
          import json, os, sys, zipfile
          import xml.etree.ElementTree as ET

          aab_path, manifest_path = sys.argv[1], sys.argv[2]
          manifest_text = open(manifest_path, "r", encoding="utf-8").read()

          if "com.aistudio.farsijoon.kqvtzr" in manifest_text:
              print("FAIL: Old package name com.aistudio.farsijoon.kqvtzr appeared in AAB manifest dump.")
              sys.exit(1)

          ANDROID_NS = "{http://schemas.android.com/apk/res/android}"
          root = ET.fromstring(manifest_text)
          pkg = root.attrib.get("package", "")
          ver_code = root.attrib.get(f"{ANDROID_NS}versionCode", "")
          ver_name = root.attrib.get(f"{ANDROID_NS}versionName", "")
          if pkg != "com.tavana.farsijoon":
              print(f"FAIL: AAB manifest package is '{pkg}', expected 'com.tavana.farsijoon'.")
              sys.exit(1)
          if not ver_code or not ver_name:
              print(f"FAIL: Missing versionCode ('{ver_code}') or versionName ('{ver_name}') in AAB manifest.")
              sys.exit(1)
          app_el = root.find("application")
          if app_el is None:
              print("FAIL: Missing <application> element in AAB manifest.")
              sys.exit(1)
          debuggable = app_el.attrib.get(f"{ANDROID_NS}debuggable")
          if debuggable is not None and debuggable.lower() != "false":
              print(f"FAIL: android:debuggable is '{debuggable}' (must be absent or false).")
              sys.exit(1)

          with zipfile.ZipFile(aab_path, "r") as zf:
              names = set(zf.namelist())
          for required in [
              "base/manifest/AndroidManifest.xml",
              "base/assets/lessons.json",
              "base/assets/stories.json",
          ]:
              if required not in names:
                  print(f"FAIL: Missing required entry '{required}' inside {aab_path}.")
                  sys.exit(1)

          print(f"VERIFIED_META package={pkg} versionName={ver_name} versionCode={ver_code}")
          PYEOF

          VERSION_CODE="$(python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("'"$MANIFEST_XML"'").getroot(); print(r.attrib["{http://schemas.android.com/apk/res/android}versionCode"])')"
          VERSION_NAME="$(python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("'"$MANIFEST_XML"'").getroot(); print(r.attrib["{http://schemas.android.com/apk/res/android}versionName"])')"

          cp "$AAB_PATH" "$RELEASE_PKG_DIR_PATH/app-release.aab"

          {
            echo "### PASS: Production Release AAB Verified"
            echo "- **applicationId**: com.tavana.farsijoon"
            echo "- **versionName**: $VERSION_NAME"
            echo "- **versionCode**: $VERSION_CODE"
            echo "- **AAB size**: $AAB_BYTES bytes"
            echo "- **Certificate $OWNER_LINE**"
            echo "- **Key Source**: $KEY_SOURCE"
            if [ -n "${KEY_DIAG_NOTE:-}" ]; then
              echo "- **Key Secret Diagnostic**: $KEY_DIAG_NOTE"
            fi
            echo "- **$SHA1_LINE**"
            echo "- **$SHA256_LINE**"
            echo "- **Status**: Ready for Google Play Console (not signed with Android Debug)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Production Release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: farsi-joon-production-release-aab
          path: ${{ runner.temp }}/release-package/
          if-no-files-found: error

      - name: Shred temporary keystore from runner
        if: always()
        run: |
          for f in "${{ runner.temp }}/my-upload-key.jks" "${{ runner.temp }}/.ks_env" "${{ runner.temp }}/VerifyKeystore.java"; do
            if [ -f "$f" ]; then
              shred -u "$f" || rm -f "$f"
            fi
          done

